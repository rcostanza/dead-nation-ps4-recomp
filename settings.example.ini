# Copy to settings.ini and change what you need. Environment variables in parentheses override a key.
# A settings.ini in the save folder is read instead of the one next to the game; the in-game pages
# save there.
# Window: windowed, borderless (covers the screen at the desktop resolution) or fullscreen
# (DEADNATION_DISPLAY_MODE).
display_mode=borderless
# Aspect ratio: 16:9 (the PS4's), 4:3, 16:10, 21:9 or 32:9 (DEADNATION_ASPECT_RATIO). 21:9 and 32:9
# show more of the level to the sides, nothing stretched; the menus and HUD stay 16:9 in the middle.
# 4:3 and 16:10 show the same width and more above and below; the menus and HUD keep 16:9's
# layout, centred. Set at start.
aspect_ratio=16:9
# Windowed resolution, WIDTHxHEIGHT: the window's size, of the aspect ratio (another shape moves to the
# size of that ratio nearest in height) (DEADNATION_OUTPUT_RESOLUTION). The fullscreen modes pick their
# own: borderless the desktop, fullscreen the largest screen mode of the ratio (else the desktop's),
# with black bars when the screen is of another shape. The game's picture is filtered to it.
output_resolution=1920x1080
# Display index the window opens on, empty for the primary (DEADNATION_MONITOR).
monitor=
# VSync (DEADNATION_VSYNC): 1 waits for the monitor; 0 shows the newest frame at each refresh,
# still without tearing (some drivers hold that to twice the refresh rate).
vsync=1
# With vsync=0: 1 shows each frame at once, tearing allowed: the least input delay and no frame rate
# ceiling (DEADNATION_TEARING). README "Advanced settings".
tearing=0
# The game's frame rate: 30 (the PS4's), 60, 90, 120, 144, 180, 240 or 360, at normal game speed: the engine's
# own frame clock follows it, and weapons keep the PS4's fire rate at any rate (DEADNATION_FRAME_RATE). It is held to what the display
# refreshes at (180 on a 120 Hz display runs at 120) unless VSync is off with tearing allowed. 90 on
# a 120 Hz display is smooth with VRR (FreeSync, G-Sync); without it frames show unevenly.
# The PC must hold the rate: when it cannot, the game slows down instead of skipping frames. Also in the Display
# Settings panel (F10, or hold Select for 2 seconds), which applies it at once and saves it here
# with the other display keys.
frame_rate=60
# Render resolution (DEADNATION_RENDER_RESOLUTION; next start):
#   4k    3840x2160: the sharpest, and about three times the GPU work of 1080p
#   1440p 2560x1440: sharp, about half the GPU work of 4k; the best fit for a 1440p screen
#   1080p the PS4's native 1920x1080
#   720p  1280x720: the lightest, for weak GPUs; softer
# (each wider for 21:9 and 32:9). Rendering above the window's size costs GPU for little gain.
# Either is filtered to the output resolution. The game has no PS4 Pro mode and no HDR.
render_resolution=1080p
# Sharpening (DEADNATION_SHARPENING): 1 (default) runs AMD FSR 1 RCAS over the picture at the window's
# size, for crisper edges without halos; 0 shows it as filtered. Also in the Display Settings panel,
# where it applies at once, and on F9, which switches it over the game to compare.
sharpening=1
# Speakers: auto, stereo, 5.1, 7.1 (DEADNATION_AUDIO_CHANNELS).
audio_channels=auto
# 1 (default): start at the main menu, skipping the logos, the autosave notice, the brightness
# screen, the intro movie and the title screen; 0 shows them. The setup's checkbox sets it
# (DEADNATION_SKIP_INTRO).
skip_intro=1
# 1 (default): Back (Circle, B, Esc) on the title screen ("Press OPTIONS Button") asks whether to
# close the game; 0 leaves Back to the game, which ignores it there (DEADNATION_TITLE_BACK_EXITS).
title_back_exits=1
